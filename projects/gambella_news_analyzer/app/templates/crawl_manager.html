{% extends 'base.html' %}{% block title %}Crawl Manager{% endblock %}{% block content %}<div class="row g-4"><div class="col-lg-5"><div class="panel"><div class="panel-title">Crawler settings</div><label class="form-label">Start URL</label><input id="startUrl" class="form-control" value="https://www.gambellastarnews.com/featured-articles"><label class="form-label mt-3">Maximum articles</label><input id="maxArticles" type="number" class="form-control" value="20" min="1" max="500"><label class="form-label mt-3">Request delay (seconds)</label><input id="delay" type="number" step="0.1" class="form-control" value="1.5" min="0.5"><div class="d-flex gap-2 mt-4"><button class="btn btn-dark" onclick="startCrawl()">Start Crawl</button><button class="btn btn-outline-danger" onclick="stopCrawl()">Stop</button></div><button class="btn btn-outline-primary w-100 mt-2" onclick="processNLP()">Run NLP Processing</button></div></div><div class="col-lg-7"><div class="panel"><div class="panel-title">Live status</div><div class="status-grid"><div><span>State</span><b id="crawlState">Idle</b></div><div><span>Processed</span><b id="crawlProcessed">0</b></div><div><span>Failed</span><b id="crawlFailed">0</b></div><div><span>Current URL</span><b id="crawlUrl" class="small-url">-</b></div></div><div class="mt-4"><h6>Recent crawl logs</h6><div id="crawlLogs" class="logbox"></div></div></div></div></div>{% endblock %}{% block scripts %}<script>initCrawl();</script>{% endblock %}
